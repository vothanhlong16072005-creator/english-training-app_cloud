server {
    listen 80;
    listen 10000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — fallback mọi route về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
